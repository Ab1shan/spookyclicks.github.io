
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloween Question</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle, #292929, #050505);
      color: white;
      text-align: center;
    }

    .card {
      padding: 40px 25px;
      width: min(90%, 480px);
      border: 2px solid #ff7518;
      border-radius: 18px;
      background: #111;
      box-shadow: 0 0 25px #ff450055;
    }

    h1 {
      color: #ff7518;
      font-size: 32px;
    }

    p {
      color: #ddd;
      line-height: 1.6;
    }

    button {
      padding: 14px 28px;
      margin: 12px 7px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #yes {
      background: #ff7518;
      color: black;
    }

    #no {
      background: #333;
      color: white;
    }

    button:hover {
      transform: scale(1.05);
    }

    #scare {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: black;
      justify-content: center;
      align-items: center;
    }

    #scare video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    .warning {
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <main class="card" id="card">
    <h1>Halloween</h1>

    <p>Are you celebrating Halloween this year?</p>

    <button id="yes">YES</button>
    <button id="no">NO</button>

    <p class="warning">Choose your answer...</p>
  </main>

  <div id="scare">
    <video id="scareVideo" playsinline preload="auto">
      <source src="jeff.mp4" type="video/mp4">
      Your browser does not support this video.
    </video>
  </div>

  <script>
    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const scare = document.getElementById("scare");
    const video = document.getElementById("scareVideo");

    let playing = false;

    async function triggerJumpscare() {
      if (playing) return;

      playing = true;
      scare.style.display = "flex";

      video.currentTime = 0;
      video.muted = false;
      video.volume = 0.7;

      try {
        await video.play();
      } catch (error) {
        playing = false;
        scare.style.display = "none";

        alert(
          "Video could not play. Check that jeff.mp4 is uploaded correctly."
        );
      }
    }

    yes.addEventListener("click", triggerJumpscare);
    no.addEventListener("click", triggerJumpscare);

    video.addEventListener("ended", () => {
      scare.style.display = "none";
      video.currentTime = 0;
      playing = false;
    });
  </script>

</body>
</html>
